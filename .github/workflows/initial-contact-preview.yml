name: Read original function bundle availability
on:
  push:
    branches: [codex/tela-inicial-atendimento]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect existing bundles without publishing
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || secrets.NETLIFY_SITE_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const token=process.env.NETLIFY_AUTH_TOKEN,site=process.env.NETLIFY_SITE_ID;
          assert(token&&site);
          async function get(path){const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});return r;}
          const d=await (await get('/deploys/6ac2d52dce190d84abeb3ac1')).json();
          console.log('EXISTING_DEPLOY_DOWNLOAD '+JSON.stringify({hasSourceZip:d.has_source_zip,functionNames:d.available_functions.map(f=>f.n)}));
          const health=d.available_functions.find(f=>f.n==='health');
          const paths=['/deploys/'+d.id+'/functions/health','/sites/'+site+'/functions/health','/functions/'+health.id,'/deploys/'+d.id+'/download'];
          await Promise.all(paths.map(async path=>{
           const r=await get(path),type=r.headers.get('content-type'),buffer=Buffer.from(await r.arrayBuffer());
           let keys;try{const data=JSON.parse(buffer.toString());keys=Object.keys(data)}catch{}
           console.log('BUNDLE_READ_CHECK '+JSON.stringify({path:path.replace(site,'SITE_ID'),status:r.status,type,bytes:buffer.length,zip:buffer[0]===80&&buffer[1]===75,keys}));
          }));
          
          JS
