name: Diagnose artwork runtime before publishing
on:
  push:
    branches: [codex/tela-inicial-atendimento]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read preview runtime responses without sending messages
        run: |
          node --input-type=module <<'JS'
          const base='https://6acc350cf7fe4f3aa0f373ea--atendimento-idy.netlify.app/';
          for(const name of ['health','artwork','partial-lead']){
           const r=await fetch(base+'.netlify/functions/'+name),body=await r.text();
           console.log('RUNTIME_DIAGNOSTIC '+JSON.stringify({name,status:r.status,body:body.slice(0,1800)}));
          }
          JS
      - name: Read only new function runtime metadata
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || secrets.NETLIFY_SITE_ID }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://api.netlify.com/api/v1/deploys/6acc350cf7fe4f3aa0f373ea',{headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN}});
          const d=await r.json();
          console.log('NEW_FUNCTION_METADATA '+JSON.stringify(d.available_functions.filter(f=>['artwork','partial-lead','idle-leads'].includes(f.n)).map(f=>({name:f.n,runtime:f.r,build:f.bd}))));
          JS
