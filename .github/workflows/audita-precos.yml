name: Confere publicação autorizada do atendimento
on:
  push:
    branches: [codex/audita-atendimento-precos]
permissions:
  contents: read
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Conferir somente fontes públicas, preços e proteções sem registrar clientes
        run: node .github/scripts/verify-atendimento-publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atendimento-publicacao-verificada
          path: publication-check/report.json
