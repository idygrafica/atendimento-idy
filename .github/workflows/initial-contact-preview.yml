name: Verify published chat handoff
on:
  push:
    branches: [codex/tela-inicial-atendimento]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Inspect published page without sending a real request
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('assert/strict');
          (async()=>{
           const browser=await chromium.launch(),request=await browser.newPage(),png=await (await request.request.get('https://idygrafica.netlify.app/assets/logo-idy-grafica.png')).body();await request.close();
           for(const width of [320,390,780,1024,1280]){
            const page=await browser.newPage({viewport:{width,height:900}});let posts=0;await page.route('**/*',route=>{if(route.request().method()==='POST'){posts++;return route.abort()}return route.continue()});
            const response=await page.goto('https://atendimento-idy.netlify.app/?check='+Date.now());assert.equal(response.status(),200);
            await page.locator('#clientName').fill('Cliente de teste');await page.locator('#clientEmail').fill('cliente@example.invalid');await page.locator('#clientPhone').fill('(51) 99999-0000');await page.locator('#startButton').click();
            await page.locator('#fileInput').setInputFiles({name:'arte-exemplo.png',mimeType:'image/png',buffer:png});await page.waitForFunction(()=>document.querySelector('.art-preview')?.naturalWidth>0);
            assert.equal(posts,0);assert.equal(await page.locator('dialog').count(),0);assert.equal(await page.locator('#lead').count(),0);
            const result=await page.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth,preview:document.querySelector('.art-preview').naturalWidth>0,buttonRadius:getComputedStyle(document.querySelector('#send')).borderRadius,confirmation:[...document.querySelectorAll('.msg.bot')].at(-1).textContent}));
            assert.equal(result.width,result.scrollWidth);assert.equal(result.buttonRadius,'14px');assert(result.confirmation.includes('pode encaminhar'));console.log('LIVE_HANDOFF_VERIFIED '+JSON.stringify(result));await page.close();
           }
           await browser.close();console.log('LIVE_HANDOFF_CONFIRMED');
          })().catch(e=>{console.error(e);process.exit(1)});
          
          JS
