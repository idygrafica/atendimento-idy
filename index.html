<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IDY Gráfica — Atendimento</title>
  <style>
    :root{--navy:#0b1f33;--green:#33a852;--bg:#f5f7f9;--card:#fff;--muted:#6b7280;--line:#dde3e8}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172033}
    .wrap{max-width:1180px;margin:0 auto;padding:24px}.top{background:#fff;border-bottom:4px solid var(--green)}
    .brand{display:flex;align-items:center;gap:16px;padding:18px 24px;max-width:1180px;margin:auto}.logo{display:block;width:160px;max-width:45%;flex-shrink:0}.logo img{display:block;width:100%;height:auto}
    .sub{color:var(--muted);font-size:14px}.panel{background:var(--card);border:1px solid var(--line);min-height:560px;display:flex;flex-direction:column}
    #chat{flex:1;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:12px 14px;line-height:1.45;white-space:pre-wrap}
    .bot{align-self:flex-start;background:#edf2f6}.user{align-self:flex-end;background:var(--navy);color:#fff}.status{font-size:12px;color:var(--muted);padding:0 20px 10px}
    .composer{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:16px;border-top:1px solid var(--line);background:#fff}
    textarea{resize:none;min-height:54px;padding:12px;border:1px solid #cfd7df;font:inherit;width:100%}
    button{border:0;background:var(--green);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .attach{background:var(--navy);font-size:18px;min-width:52px}.leadbar{display:flex;gap:10px;padding:0 16px 16px;background:#fff}.leadbtn{background:var(--navy);padding:12px 16px}.filetag{font-size:12px;color:var(--muted);padding:0 20px 10px}
    .diagnostic{margin-top:14px;font-size:13px;color:var(--muted)}.diagnostic button{background:var(--navy);padding:9px 12px;margin-right:8px}
    .wa-action{display:inline-block;margin-top:10px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;padding:11px 14px}
    dialog{border:0;padding:0;max-width:520px;width:calc(100% - 30px);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}.modal{padding:22px;background:#fff}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cfd7df;font:inherit}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.actions button{padding:12px 16px}.secondary{background:#e5e7eb;color:#172033}
    .attendance-layout{display:grid;grid-template-columns:minmax(260px,405px) minmax(0,1fr);gap:28px;align-items:start}.attendance-content{min-width:0}.attendance-mascot{position:sticky;top:24px;align-self:start}.attendance-mascot img{display:block;width:405px;max-width:100%;height:auto}.start-screen input{min-width:0}.start-screen{overflow-wrap:anywhere}
    .composer{align-items:end}.composer textarea{border-radius:14px;line-height:1.4}.composer button{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:14px;transition:background .16s ease,box-shadow .16s ease,transform .16s ease}.composer button svg{width:21px;height:21px;flex-shrink:0}.composer .attach{width:54px;min-width:54px;padding:0;background:#eaf4ee;color:#176333;border:1px solid #c6dfd0}.composer .attach:hover:not(:disabled){background:#dcefe3}.composer #send{background:linear-gradient(135deg,#33a852,#238b40);font-size:14px;box-shadow:0 4px 12px rgba(35,139,64,.18)}.composer #send:hover:not(:disabled){box-shadow:0 6px 16px rgba(35,139,64,.26);transform:translateY(-1px)}.composer button:focus-visible,.composer textarea:focus-visible{outline:3px solid #0b1f33;outline-offset:3px}.composer button:active:not(:disabled){transform:translateY(0)}.filetag{overflow-wrap:anywhere}
    @media(prefers-reduced-motion:reduce){.composer button{transition:none}}
    .msg{overflow-wrap:anywhere}.art-preview{display:block;width:auto;max-width:min(280px,100%);max-height:240px;height:auto;object-fit:contain;margin-top:10px;border:1px solid rgba(255,255,255,.24);border-radius:10px;background:#fff}
    [hidden]{display:none!important}.start-screen{background:var(--card);border:1px solid var(--line);padding:28px;max-width:560px;margin:0 auto}.start-screen h1{font-size:26px;margin:0 0 12px}.start-screen p{line-height:1.5;color:var(--muted)}.start-screen button{padding:14px 18px;width:100%;margin-top:12px}.start-error{color:#b42318!important;min-height:20px;margin:12px 0 0}.contact-summary{white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:780px){.attendance-layout{grid-template-columns:minmax(0,1fr);gap:16px}.attendance-mascot{position:static;justify-self:start}.attendance-mascot img{width:405px;max-width:100%;height:auto}.attendance-content{width:100%}}
    @media(max-width:640px){.wrap{padding:0}.start-screen{padding:22px;border-left:0;border-right:0}.panel{border-left:0;border-right:0}.msg{max-width:92%}.composer{grid-template-columns:auto 1fr}.composer #send{grid-column:1/3;height:46px}.leadbar{padding-bottom:12px}.leadbtn{width:100%}}
  </style>
</head>
<body>
  <div class="top"><div class="brand"><a class="logo" href="https://idygrafica.netlify.app/" aria-label="Site da IDY Gráfica"><img src="https://idygrafica.netlify.app/assets/logo-idy-grafica.png" alt="IDY Gráfica — Impressos em geral" width="160" /></a><div class="sub">Atendimento online</div></div></div>
  <div class="wrap">
    <div class="attendance-layout">
    <aside class="attendance-mascot"><img src="https://idygrafica.netlify.app/assets/mascote-idy.png" alt="Mascote original da IDY Gráfica" width="1024" height="1536" /></aside>
    <div class="attendance-content">
    <section id="startScreen" class="start-screen" aria-labelledby="startTitle">
      <h1 id="startTitle">Vamos começar seu orçamento?</h1>
      <p>Informe seus dados para iniciar o atendimento com a IA da IDY Gráfica.</p>
      <form id="startForm">
        <div class="field"><label for="clientName">Nome</label><input id="clientName" autocomplete="name" maxlength="120" required /></div>
        <div class="field"><label for="clientEmail">E-mail</label><input id="clientEmail" type="email" autocomplete="email" maxlength="254" required /></div>
        <div class="field"><label for="clientPhone">Telefone / WhatsApp</label><input id="clientPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="(51) 99999-9999" required /></div>
        <p>Ao finalizar, confirme na conversa o envio do orçamento e do arquivo à equipe da IDY para receber o retorno.</p>
        <p id="startError" class="start-error" role="alert" aria-live="polite"></p>
        <button id="startButton" type="submit">Iniciar atendimento</button>
      </form>
    </section>
    <div id="chatPanel" class="panel" hidden>
      <div id="chat" role="log" aria-live="polite"></div>
      <div id="status" class="status">Pronto.</div>
      <div id="filetag" class="filetag"></div>
      <div class="composer">
        <button class="attach" id="attach" type="button" title="Anexar arte ou logo" aria-label="Anexar arte ou logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 6.5-7 7a3.5 3.5 0 0 0 5 5L20 10a5 5 0 0 0-7-7L4.5 11.5a6.5 6.5 0 0 0 9 9l6-6"/></svg></button>
        <textarea id="message" placeholder="Digite sua mensagem..." disabled></textarea>
        <button id="send" type="button" aria-label="Enviar mensagem" disabled><span>Enviar</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-6 18-4-8-8-4Z"/><path d="m21 3-10 10"/></svg></button>
      </div>
    </div>
    <div class="diagnostic"><button id="health">Testar conexão</button><span id="healthResult"></span></div>
    </div>
    </div>
  </div>

  <input id="fileInput" type="file" accept=".pdf,.png,.jpg,.jpeg" hidden />

  <!-- Formulário estático para a Netlify detectar e armazenar os atendimentos -->
  <form name="atendimento-idy" data-netlify="true" enctype="multipart/form-data" hidden>
    <input type="text" name="nome" />
    <input type="email" name="email" />
    <input type="text" name="whatsapp" />
    <textarea name="resumo"></textarea>
    <input type="file" name="arte" />
  </form>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('message');
const send=document.getElementById('send');
const statusEl=document.getElementById('status');
const healthResult=document.getElementById('healthResult');
const fileInput=document.getElementById('fileInput');
const filetag=document.getElementById('filetag');
const attach=document.getElementById('attach');
const history=[];
let selectedFile=null;
let clientContact=null;
let asking=false;
let handoffOffered=false;
let handoffQueued=false;
let submitting=false;
let registered=false;
let retryAvailable=false;
let previewUrl=null;
let previewImage=null;

document.getElementById('startForm').addEventListener('submit',event=>{
  event.preventDefault();
  if(clientContact)return;
  const nome=document.getElementById('clientName').value.trim();
  const email=document.getElementById('clientEmail').value.trim();
  const whatsapp=document.getElementById('clientPhone').value.trim();
  const phoneDigits=whatsapp.replace(/\D/g,'');
  const error=document.getElementById('startError');
  if(!nome){error.textContent='Informe seu nome.';document.getElementById('clientName').focus();return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){error.textContent='Informe um e-mail válido.';document.getElementById('clientEmail').focus();return;}
  if(phoneDigits.length<10||phoneDigits.length>15){error.textContent='Informe um telefone válido com DDD.';document.getElementById('clientPhone').focus();return;}
  clientContact={nome,email,whatsapp};
  error.textContent='';
  document.getElementById('startScreen').hidden=true;
  document.getElementById('chatPanel').hidden=false;
  input.disabled=false;send.disabled=false;
  addMsg('Olá, '+nome+'! Sou o atendimento virtual da IDY Gráfica. O que você precisa?\n\nQuando estiver tudo certo, escreva “pode encaminhar” para enviar seu atendimento à equipe da IDY.');
  input.focus();
});

function addMsg(text,who='bot'){
  const el=document.createElement('div');el.className='msg '+who;
  if(who==='bot'){
    const m=text.match(/\[\[WHATSAPP:([\s\S]*?)\]\]/);
    const clean=text.replace(/\n?\[\[WHATSAPP:[\s\S]*?\]\]/,'').trim();
    const t=document.createElement('div');t.textContent=clean;el.appendChild(t);
    if(m){const a=document.createElement('a');a.className='wa-action';a.target='_blank';a.rel='noopener';a.href='https://wa.me/5551981687562?text='+encodeURIComponent(m[1].trim());a.textContent='Abrir WhatsApp da IDY';el.appendChild(a);}
  }else el.textContent=text;
  chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
  return el;
}

function showArtPreview(file,bubble){
  if(previewImage){previewImage.remove();previewImage=null;}
  if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null;}
  if(!['image/jpeg','image/png'].includes(file.type))return;
  const image=document.createElement('img');image.className='art-preview';image.alt='Prévia da arte selecionada: '+file.name;
  previewUrl=URL.createObjectURL(file);image.src=previewUrl;previewImage=image;
  image.addEventListener('load',()=>{chat.scrollTop=chat.scrollHeight;});
  image.addEventListener('error',()=>{image.remove();if(previewImage===image){URL.revokeObjectURL(previewUrl);previewUrl=null;previewImage=null;}});
  bubble.appendChild(image);
}

function offerHandoff(){
  if(asking||submitting||registered||handoffOffered)return;
  const question='Precisa de mais alguma coisa? Se não precisar, encaminho seu orçamento'+(selectedFile?' e o arquivo selecionado':'')+' à equipe da IDY para entrar em contato contigo. Você pode responder “pode encaminhar” ou continuar tirando suas dúvidas.';
  addMsg(question);history.push({role:'assistant',content:question});handoffOffered=true;handoffQueued=false;
}

function isHandoffConfirmation(text){
  const raw=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  if(handoffOffered&&/^nao\s*[,;.]\s*pode (encaminhar|enviar|finalizar)[.!]?\s*$/.test(raw))return true;
  const normalized=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim();
  const explicit=['pode encaminhar','pode enviar','pode finalizar','pode encaminhar para a idy','pode enviar para a idy','sim pode encaminhar','sim pode enviar','sim pode finalizar','pode encaminhar sim','pode enviar sim','tudo certo pode encaminhar','tudo certo pode enviar'];
  const finished=['nao','nao obrigado','nao obrigada','nao preciso de mais nada','nao preciso de nada','nao mais nada','nao precisa','so isso','somente isso','tudo certo','esta tudo certo','ta tudo certo','pode sim'];
  // “Não pode enviar” é recusa, mesmo que a conversa esteja aguardando confirmação.
  if(normalized==='nao pode encaminhar'||normalized==='nao pode enviar')return false;
  return explicit.includes(normalized)||(handoffOffered&&finished.includes(normalized))||(retryAvailable&&['tentar novamente','tente novamente','pode tentar novamente'].includes(normalized));
}

async function ask(){
  const text=input.value.trim();if(!clientContact||!text||asking||submitting)return;
  const confirmed=isHandoffConfirmation(text);
  addMsg(text,'user');history.push({role:'user',content:text});input.value='';
  if(confirmed){
    if(registered){addMsg('Seu atendimento já foi registrado para a equipe da IDY. Não é necessário enviar novamente.');return;}
    handoffOffered=false;await submitConversation();return;
  }
  handoffOffered=false;retryAvailable=false;asking=true;send.disabled=true;statusEl.textContent='Respondendo...';
  let answered=false;
  try{
    const r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);
    const answer=data.answer||'Não consegui gerar uma resposta.';addMsg(answer,'bot');history.push({role:'assistant',content:answer});statusEl.textContent='Pronto.';answered=true;
  }catch(e){addMsg('Erro de conexão: '+e.message,'bot');statusEl.textContent='Falha na conexão.';}finally{asking=false;send.disabled=false;input.focus();if(selectedFile&&(answered||handoffQueued))offerHandoff();}
}

send.addEventListener('click',ask);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});

attach.addEventListener('click',()=>{if(clientContact&&!submitting)fileInput.click();});
fileInput.addEventListener('change',()=>{
  if(!clientContact||submitting)return;
  const f=fileInput.files?.[0];if(!f)return;
  if(f.size>8*1024*1024){alert('O arquivo pode ter no máximo 8 MB.');fileInput.value='';return;}
  selectedFile=f;filetag.textContent='Arte selecionada: '+f.name;const bubble=addMsg('Arquivo selecionado: '+f.name,'user');showArtPreview(f,bubble);history.push({role:'user',content:'O cliente selecionou uma arte/arquivo chamado '+f.name+'.'});
  handoffOffered=false;handoffQueued=true;offerHandoff();
});

async function submitConversation(){
  if(!clientContact||submitting||registered||asking)return;
  const {nome,email,whatsapp}=clientContact;
  submitting=true;send.disabled=true;input.disabled=true;attach.disabled=true;retryAvailable=false;
  statusEl.textContent='Registrando seu atendimento...';
  addMsg('Estou enviando seu atendimento'+(selectedFile?' e o arquivo selecionado':'')+' à equipe da IDY.');
  try{
    const conversation=history.map(m=>(m.role==='user'?'CLIENTE: ':'ATENDENTE: ')+m.content).join('\n\n');
    const resumo='Cliente: '+nome+'\nE-mail: '+email+'\nWhatsApp: '+whatsapp+'\n\n'+(conversation||'Atendimento sem histórico.');
    const fd=new FormData();fd.append('form-name','atendimento-idy');fd.append('nome',nome);fd.append('email',email);fd.append('whatsapp',whatsapp);fd.append('resumo',resumo);if(selectedFile)fd.append('arte',selectedFile,selectedFile.name);
    const r=await fetch('/',{method:'POST',body:fd});if(!r.ok)throw new Error('Não foi possível registrar o atendimento.');

    registered=true;
    statusEl.textContent='Atendimento registrado. Avisando a equipe...';
    addMsg('Seu atendimento foi registrado para a IDY Gráfica. A equipe poderá entrar em contato pelos dados que você informou.');
    try{
    const notification=await fetch('/.netlify/functions/notify-idy-whatsapp',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        nome,
        whatsapp,
        resumo:resumo||'Atendimento sem histórico.',
        arquivo:selectedFile?selectedFile.name:''
      })
    });
    const result=await notification.json().catch(()=>({}));
    if(!notification.ok||result.ok!==true)throw new Error('Aviso não confirmado');
    statusEl.textContent='Atendimento registrado e equipe avisada pelo WhatsApp.';
    }catch{
      statusEl.textContent='Atendimento registrado; aviso pelo WhatsApp não confirmado.';
      addMsg('O registro está salvo, mas não consegui confirmar o aviso pelo WhatsApp. Não é necessário enviar seu atendimento novamente.');
    }
  }catch{
    retryAvailable=true;statusEl.textContent='Não foi possível confirmar o registro.';
    addMsg('Não consegui confirmar o registro do atendimento. Seu arquivo continua selecionado. Para repetir o envio, escreva “tentar novamente”.');
  }finally{submitting=false;send.disabled=false;input.disabled=false;attach.disabled=false;input.focus();}
}

document.getElementById('health').addEventListener('click',async()=>{healthResult.textContent='Testando...';try{const r=await fetch('/.netlify/functions/health');const d=await r.json();healthResult.textContent=`${r.status} — ${d.status}${d.hasKey===false?' — OPENAI_API_KEY ausente':''}`;}catch(e){healthResult.textContent='Falha ao alcançar a função Netlify.';}});
</script>
</body>
</html>
