name: Verify published initial contact screen
on:
  push:
    branches: [codex/tela-inicial-atendimento]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check flow
        run: node flow.test.mjs
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify actual published page without submitting requests
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('assert/strict');
          (async()=>{
            const browser=await chromium.launch();
            for(const width of [320,390,780,1024,1280]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.route('**/*',route=>route.request().method()==='POST'?route.abort():route.continue());
              const response=await page.goto('https://atendimento-idy.netlify.app/?verified='+Date.now());assert.equal(response.status(),200);
              await page.evaluate(()=>Promise.all([...document.images].map(e=>e.decode())));
              assert(await page.locator('#startScreen').isVisible());assert(!(await page.locator('#chatPanel').isVisible()));
              const result=await page.evaluate(()=>{
                const img=document.querySelector('.attendance-mascot img'),form=document.querySelector('#startScreen'),m=img.getBoundingClientRect(),f=form.getBoundingClientRect();
                return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,mascotWidth:m.width,overlap:m.left<f.right&&m.right>f.left&&m.top<f.bottom&&m.bottom>f.top,logo:document.querySelector('.logo img').src};
              });
              assert.equal(result.width,result.scrollWidth);assert(!result.overlap);assert(result.logo.endsWith('/assets/logo-idy-grafica.png'));
              await page.locator('#clientName').fill('Cliente de teste');await page.locator('#clientEmail').fill('cliente@example.invalid');await page.locator('#clientPhone').fill('(51) 99999-0000');await page.locator('#startButton').click();
              assert(await page.locator('#chatPanel').isVisible());assert(!(await page.locator('#startScreen').isVisible()));assert(await page.locator('#send').isEnabled());
              console.log('LIVE_INITIAL_SCREEN_VERIFIED '+JSON.stringify(result));await page.close();
            }
            await browser.close();console.log('LIVE_INITIAL_SCREEN_CONFIRMED');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
