name: Diagnostica autenticação Netlify sem publicação
on:
  push:
    branches: [codex/audita-atendimento-precos]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Leituras autenticadas sem expor credenciais
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || secrets.NETLIFY_SITE_ID }}
        run: node .github/scripts/diagnose-netlify-auth.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-netlify-sem-publicacao
          path: diagnostico-netlify/report.json
