name: Diagnose image preview counters (read only)
on:
  push:
    branches: [codex/corrige-limite-previas]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install storage client for read-only access
        run: npm install --no-save --package-lock=false @netlify/blobs@11.1.4
      - name: Read limits and daily counters without changing them
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || secrets.NETLIFY_SITE_ID }}
        run: |
          node --input-type=module <<'JS'
          import {getStore} from '@netlify/blobs';
          const token=process.env.NETLIFY_AUTH_TOKEN,siteId=process.env.NETLIFY_SITE_ID;
          if(!token||!siteId)throw Error('Credenciais de diagnóstico não disponíveis');
          async function api(path){
           const response=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token}});
           if(!response.ok)throw Error('Leitura Netlify HTTP '+response.status);
           return response.json();
          }
          const site=await api('/sites/'+siteId);if(site.name!=='atendimento-idy')throw Error('Projeto incorreto');
          const deploy=await api('/deploys/'+site.published_deploy.id);
          const entries=await api('/accounts/'+site.account_id+'/env?site_id='+siteId);
          const settings={};
          for(const key of ['IDY_ARTWORK_DAILY_LIMIT','IDY_ARTWORK_PER_IP_LIMIT','IDY_ARTWORK_MODEL','IDY_ARTWORK_IMAGE_MODEL']){
           const entry=entries.find(e=>e.key===key),value=entry?.values?.find(v=>v.context==='production')||entry?.values?.find(v=>v.context==='all');
           settings[key]={configured:!!entry,readable:!entry?.is_secret,value:entry?.is_secret?undefined:value?.value};
          }
          const stamp=new Date(),local=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(stamp);
          console.log('ARTWORK_LIMIT_SETTINGS '+JSON.stringify({publishedDeploy:deploy.id,utcNow:stamp.toISOString(),utcDay:stamp.toISOString().slice(0,10),saoPauloDay:local,settings}));
          const store=getStore({name:'idy-artwork-usage',siteID:siteId,token,consistency:'strong'}),days={};
          for await(const page of store.list({prefix:'quota/',paginate:true})){
           for(const {key} of page.blobs){
            const parts=key.split('/'),day=parts[1],kind=parts[2];if(!/^\d{4}-\d{2}-\d{2}$/.test(day))continue;
            const old=await store.getWithMetadata(key,{type:'json',consistency:'strong'});if(!old)continue;
            const summary=days[day]||={global:null,ipCounts:[]};
            if(kind==='global')summary.global=old.data.count;
            if(kind==='ip')summary.ipCounts.push(old.data.count);
           }
          }
          console.log('ARTWORK_COUNTERS_READ_ONLY '+JSON.stringify(Object.entries(days).sort().slice(-10).map(([day,data])=>({day,...data,ipCounts:data.ipCounts.sort((a,b)=>a-b)}))));
          console.log('READ_ONLY_DIAGNOSTIC_COMPLETED');
          
          JS
