name: Inspect existing AI page deployment
on:
  push:
    branches: [codex/tela-inicial-atendimento]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only existing deployment metadata
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || secrets.NETLIFY_SITE_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const token=process.env.NETLIFY_AUTH_TOKEN,siteId=process.env.NETLIFY_SITE_ID;
          assert(token&&siteId,'Credenciais Netlify indisponíveis para este workflow');
          async function get(path){const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});assert(r.ok,'Consulta Netlify HTTP '+r.status);return r.json();}
          const site=await get('/sites/'+siteId);assert.equal(site.name,'atendimento-idy');assert.equal(site.id,siteId);
          const deploy=await get('/deploys/'+site.published_deploy.id);assert.equal(deploy.state,'ready');assert.equal(deploy.site_id,siteId);
          const files=await get('/sites/'+siteId+'/files'),functionResult=await get('/sites/'+siteId+'/functions');
          const functions=Array.isArray(functionResult)?functionResult:(Array.isArray(functionResult.functions)?functionResult.functions:[]);
          console.log('FUNCTION_RESPONSE_SCHEMA '+JSON.stringify({keys:Object.keys(functionResult),array:Array.isArray(functionResult),sample:functions.slice(0,8).map(f=>({keys:Object.keys(f),name:f.name,sha:f.sha,id:f.id,functions:f.functions?.map(x=>({keys:Object.keys(x),name:x.name,sha:x.sha}))}))}));
          const live=await (await fetch('https://atendimento-idy.netlify.app/?source='+Date.now())).text(),original=fs.readFileSync('index.html','utf8');
          const main=await (await fetch('https://raw.githubusercontent.com/idygrafica/atendimento-idy/ef5c8c717e3f81f5cfd280b33d52944e655b7ad2/index.html')).text();
          const scripts=s=>s.split('<script>').slice(1).map(x=>x.split('</script>')[0].trim());
          const mainMatches=JSON.stringify(scripts(live))===JSON.stringify(scripts(main));
          const report={site:'atendimento-idy',deployId:deploy.id,deployState:deploy.state,mainScriptMatchesLive:mainMatches,deployKeys:Object.keys(deploy).filter(k=>!/(environment|token|secret)/i.test(k)),files:files.map(f=>({path:f.path,sha:f.sha,size:f.size})),functions:functions.map(f=>({name:f.name,id:f.id,keys:Object.keys(f).filter(k=>!/(environment|token|secret)/i.test(k)),sha:f.sha,deploy_id:f.deploy_id,runtime:f.runtime,n:f.n,d:f.d,dn:f.dn,bd:f.bd,r:f.r,rg:f.rg,schedule:f.schedule})),availableFunctions:deploy.available_functions?.map(f=>({keys:Object.keys(f),name:f.name,sha:f.sha,n:f.n,d:f.d,dn:f.dn,bd:f.bd,id:f.id,r:f.r,rg:f.rg,schedule:f.schedule})),functionSchedules:deploy.function_schedules,functionsConfig:deploy.functions_config,functionsRegion:deploy.functions_region,hasServer:Boolean(deploy.server),hasEdgeFunctions:Boolean(deploy.edge_functions),siteFunctionsKeys:Object.keys(site).filter(k=>/function|edge/.test(k))};
          fs.mkdirSync('.netlify',{recursive:true});fs.writeFileSync('.netlify/frontend-preflight.json',JSON.stringify(report,null,2));console.log('FRONTEND_PREFLIGHT '+JSON.stringify(report));
          assert(mainMatches,'A página publicada difere do código base; preservar as alterações em andamento');
          JS
