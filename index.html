<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IDY Gráfica — Atendimento</title>
  <style>
    :root{--navy:#0b1f33;--green:#33a852;--bg:#f5f7f9;--card:#fff;--muted:#6b7280;--line:#dde3e8}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172033}
    .wrap{max-width:860px;margin:0 auto;padding:24px}.top{background:#fff;border-bottom:4px solid var(--green)}
    .brand{display:flex;align-items:center;gap:12px;padding:18px 24px;max-width:860px;margin:auto}.logo{font-size:28px;font-weight:800;color:var(--navy)}.logo b{color:var(--green)}
    .sub{color:var(--muted);font-size:14px}.panel{background:var(--card);border:1px solid var(--line);min-height:560px;display:flex;flex-direction:column}
    #chat{flex:1;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:12px 14px;line-height:1.45;white-space:pre-wrap}
    .bot{align-self:flex-start;background:#edf2f6}.user{align-self:flex-end;background:var(--navy);color:#fff}.status{font-size:12px;color:var(--muted);padding:0 20px 10px}
    .composer{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:16px;border-top:1px solid var(--line);background:#fff}
    textarea{resize:none;min-height:54px;padding:12px;border:1px solid #cfd7df;font:inherit;width:100%}
    button{border:0;background:var(--green);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .attach{background:var(--navy);font-size:18px;min-width:52px}.leadbar{display:flex;gap:10px;padding:0 16px 16px;background:#fff}.leadbtn{background:var(--navy);padding:12px 16px}.filetag{font-size:12px;color:var(--muted);padding:0 20px 10px}
    .diagnostic{margin-top:14px;font-size:13px;color:var(--muted)}.diagnostic button{background:var(--navy);padding:9px 12px;margin-right:8px}
    .wa-action{display:inline-block;margin-top:10px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;padding:11px 14px}
    dialog{border:0;padding:0;max-width:520px;width:calc(100% - 30px);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}.modal{padding:22px;background:#fff}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cfd7df;font:inherit}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.actions button{padding:12px 16px}.secondary{background:#e5e7eb;color:#172033}
    @media(max-width:640px){.wrap{padding:0}.panel{border-left:0;border-right:0}.msg{max-width:92%}.composer{grid-template-columns:auto 1fr}.composer #send{grid-column:1/3;height:46px}.leadbar{padding-bottom:12px}.leadbtn{width:100%}}
  </style>
</head>
<body>
  <div class="top"><div class="brand"><div class="logo">IDY <b>GRÁFICA</b></div><div class="sub">Atendimento online</div></div></div>
  <div class="wrap">
    <div class="panel">
      <div id="chat"><div class="msg bot">Olá! Sou o atendimento virtual da IDY Gráfica. O que você precisa?</div></div>
      <div id="status" class="status">Pronto.</div>
      <div id="filetag" class="filetag"></div>
      <div class="composer">
        <button class="attach" id="attach" title="Anexar arte ou logo">📎</button>
        <textarea id="message" placeholder="Digite sua mensagem..."></textarea>
        <button id="send">Enviar</button>
      </div>
      <div class="leadbar"><button id="lead" class="leadbtn">Enviar atendimento para a IDY</button></div>
    </div>
    <div class="diagnostic"><button id="health">Testar conexão</button><span id="healthResult"></span></div>
  </div>

  <input id="fileInput" type="file" accept=".pdf,.png,.jpg,.jpeg" hidden />

  <dialog id="leadDialog">
    <div class="modal">
      <h2>Enviar atendimento para a IDY</h2>
      <p>Informe seus dados para a gráfica retornar o contato.</p>
      <div class="field"><label for="clientName">Nome</label><input id="clientName" autocomplete="name" /></div>
      <div class="field"><label for="clientPhone">WhatsApp</label><input id="clientPhone" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" /></div>
      <div id="dialogFile" class="filetag" style="padding:0"></div>
      <div class="actions"><button id="cancelLead" class="secondary">Cancelar</button><button id="submitLead">Enviar para a IDY</button></div>
    </div>
  </dialog>

  <!-- Formulário estático para a Netlify detectar e armazenar os atendimentos -->
  <form name="atendimento-idy" data-netlify="true" enctype="multipart/form-data" hidden>
    <input type="text" name="nome" />
    <input type="text" name="whatsapp" />
    <textarea name="resumo"></textarea>
    <input type="file" name="arte" />
  </form>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('message');
const send=document.getElementById('send');
const statusEl=document.getElementById('status');
const healthResult=document.getElementById('healthResult');
const fileInput=document.getElementById('fileInput');
const filetag=document.getElementById('filetag');
const dialogFile=document.getElementById('dialogFile');
const leadDialog=document.getElementById('leadDialog');
const history=[];
let selectedFile=null;

function addMsg(text,who='bot'){
  const el=document.createElement('div');el.className='msg '+who;
  if(who==='bot'){
    const m=text.match(/\[\[WHATSAPP:([\s\S]*?)\]\]/);
    const clean=text.replace(/\n?\[\[WHATSAPP:[\s\S]*?\]\]/,'').trim();
    const t=document.createElement('div');t.textContent=clean;el.appendChild(t);
    if(m){const a=document.createElement('a');a.className='wa-action';a.target='_blank';a.rel='noopener';a.href='https://wa.me/5551981687562?text='+encodeURIComponent(m[1].trim());a.textContent='Abrir WhatsApp da IDY';el.appendChild(a);}
  }else el.textContent=text;
  chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
}

async function ask(){
  const text=input.value.trim();if(!text)return;
  addMsg(text,'user');history.push({role:'user',content:text});input.value='';send.disabled=true;statusEl.textContent='Respondendo...';
  try{
    const r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);
    const answer=data.answer||'Não consegui gerar uma resposta.';addMsg(answer,'bot');history.push({role:'assistant',content:answer});statusEl.textContent='Pronto.';
  }catch(e){addMsg('Erro de conexão: '+e.message,'bot');statusEl.textContent='Falha na conexão.';}finally{send.disabled=false;input.focus();}
}

send.addEventListener('click',ask);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});

document.getElementById('attach').addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{
  const f=fileInput.files?.[0];if(!f)return;
  if(f.size>8*1024*1024){alert('O arquivo pode ter no máximo 8 MB.');fileInput.value='';return;}
  selectedFile=f;filetag.textContent='📎 Arte selecionada: '+f.name;dialogFile.textContent='📎 Arte: '+f.name;addMsg('Arte anexada: '+f.name,'user');history.push({role:'user',content:'O cliente anexou uma arte/arquivo chamado '+f.name+'.'});
});

document.getElementById('lead').addEventListener('click',()=>leadDialog.showModal());
document.getElementById('cancelLead').addEventListener('click',()=>leadDialog.close());

document.getElementById('submitLead').addEventListener('click',async()=>{
  const nome=document.getElementById('clientName').value.trim();
  const whatsapp=document.getElementById('clientPhone').value.trim();
  if(!nome){alert('Informe seu nome.');return;}
  if(!whatsapp){alert('Informe seu WhatsApp.');return;}
  const btn=document.getElementById('submitLead');btn.disabled=true;btn.textContent='Enviando...';
  try{
    const resumo=history.map(m=>(m.role==='user'?'CLIENTE: ':'ATENDENTE: ')+m.content).join('\n\n');
    const fd=new FormData();fd.append('form-name','atendimento-idy');fd.append('nome',nome);fd.append('whatsapp',whatsapp);fd.append('resumo',resumo||'Atendimento sem histórico.');if(selectedFile)fd.append('arte',selectedFile,selectedFile.name);
    const r=await fetch('/',{method:'POST',body:fd});if(!r.ok)throw new Error('Não foi possível registrar o atendimento.');

    // Além de registrar o atendimento na Netlify (e manter o e-mail como segurança),
    // envia um aviso com o resumo para o WhatsApp interno da IDY.
    fetch('/.netlify/functions/notify-idy-whatsapp',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        nome,
        whatsapp,
        resumo:resumo||'Atendimento sem histórico.',
        arquivo:selectedFile?selectedFile.name:''
      })
    }).then(async resp=>{
      const data=await resp.json().catch(()=>({}));
      if(!resp.ok || data.ok===false) console.warn('Aviso WhatsApp IDY não enviado:',data.error||resp.status);
    }).catch(err=>console.warn('Falha ao avisar WhatsApp IDY:',err));

    leadDialog.close();addMsg('Recebi seus dados e o atendimento foi encaminhado para a IDY Gráfica. A equipe pode retornar pelo WhatsApp informado.','bot');statusEl.textContent='Atendimento enviado para a IDY.';
  }catch(e){alert(e.message);}finally{btn.disabled=false;btn.textContent='Enviar para a IDY';}
});

document.getElementById('health').addEventListener('click',async()=>{healthResult.textContent='Testando...';try{const r=await fetch('/.netlify/functions/health');const d=await r.json();healthResult.textContent=`${r.status} — ${d.status}${d.hasKey===false?' — OPENAI_API_KEY ausente':''}`;}catch(e){healthResult.textContent='Falha ao alcançar a função Netlify.';}});
</script>
</body>
</html>
